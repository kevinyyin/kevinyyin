name: Update profile art

# Rebuilds the profile cards and README from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

# serialize runs so a push-triggered and a manual run can't race on the commit
concurrency:
  group: profile-art

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # branch tip, not the (possibly stale) trigger sha

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # If a source is down, keep going with the last saved data so the profile
      # still renders, then fail at the end so GitHub emails you.
      - name: Fetch contributions (no auth needed)
        id: contributions
        continue-on-error: true
        run: python scripts/fetch_contributions.py

      - name: Fetch recent activity
        id: activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_activity.py

      - name: Render cards and README
        run: python scripts/render.py

      - name: Commit updated profile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile [skip ci]"
          file_pattern: "data profile README.md"

      - name: Report a failed fetch
        if: steps.contributions.outcome == 'failure' || steps.activity.outcome == 'failure'
        run: |
          echo "::error::A data fetch failed (contributions: ${{ steps.contributions.outcome }}, activity: ${{ steps.activity.outcome }}). The profile was rendered from the last saved data."
          exit 1
